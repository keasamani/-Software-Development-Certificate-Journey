<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {
            font-family: Arial, sans-serif;

        }
        nav ul li {
            display: inline;
            margin: 0 20px;
        }
        nav ul li a {
            color: white;

<body>
    <header>
        <h1>Contact Us</h1>

        <h2>Get in touch with us</h2>

            <label for="name">Name:</label>
